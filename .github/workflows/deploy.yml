name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pinned to the version verified locally. Blowfish declares a max of
      # 0.165.0 and warns on newer, but builds correctly on this one.
      HUGO_VERSION: 0.166.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so .GitInfo and .Lastmod work
      - name: Install Hugo extended
        run: |
          wget -qO hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i hugo.deb
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25" # Hugo Modules needs a Go toolchain
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
